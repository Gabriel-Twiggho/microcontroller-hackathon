# Simulate the hand-written Stage 1 CALL/RET smoke test.
simulate:
  output-dir: ./build/call-sim
  program: ./build/test_leaf_call.hex

  rtl:
    base-dir: ./rtl
    files:
      - alu.v
      - regfile.v
      - imem.v
      - decoder.v
      - cpu.v
      - tb.v

  verify:
    - register: r8
      value: 42

  options:
    max-cycles: 100
    trace: false

  assembler: ./tools/asm.py
