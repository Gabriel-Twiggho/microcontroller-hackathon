simulate:
  output-dir: ./build/cmp-sim
  program: ./tests/PID_Tiny_CMP.asm
  rtl:
    base-dir: ./rtl
    defines: {TINY_HAS_SAR: null, TINY_HAS_CMP: null, TINY_CMP: null}
    files: [imem.v, dmem.v, regfile.v, cpu.v, tb.v]
  verify:
    - {register: r3, value: 0xFFFF}
    - {register: r4, value: 0xFC28}
    - {register: r5, value: 0}
    - {register: r6, value: 0}
    - {register: r7, value: 0xFE12}
  options: {max-cycles: 45000, trace: false}
  assembler: ./tools/asm.py
