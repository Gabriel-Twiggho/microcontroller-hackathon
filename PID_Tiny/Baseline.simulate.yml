simulate:
  output-dir: ./build/baseline-sim
  program: ./tests/PID_Tiny_Baseline.asm
  rtl:
    base-dir: ./rtl
    files: [imem.v, dmem.v, regfile.v, cpu.v, tb.v]
  verify:
    - {register: r3, value: 0xFFFF}
    - {register: r4, value: 0xFC28}
    - {register: r5, value: 0}
    - {register: r7, value: 0xE128}
  options: {max-cycles: 40000, trace: false}
  assembler: ./tools/asm.py
