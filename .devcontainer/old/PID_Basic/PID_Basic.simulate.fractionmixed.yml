simulate:
  output-dir: ./build/fraction-mixed-hardcoded-sim
  program: ./PID_FractionMixed_test.asm
  rtl:
    base-dir: ./rtl
    files:
      - imem.v
      - dmem.v
      - regfile.v
      - alu.v
      - decoder.v
      - cpu.v
      - tb.v
  verify:
    - register: r3
      value: 16           # error
    - register: r4
      value: 20           # integral
    - register: r6
      value: 8            # derivative
    - register: r8
      value: 2048         # P (scaled Q8; real 8)
    - register: r9
      value: 0xFFFFFB00   # I = -1280 (scaled Q8; real -5)
    - register: r10
      value: 256          # D (scaled Q8; real 1)
    - register: r11
      value: 1024          # output, still scaled (Q8) -- untouched by the downscale
    - register: r12
      value: 4            # the REAL answer, produced entirely on-chip
  options:
    max-cycles: 25000
    trace: false
  assembler: ./tools/asm.py
