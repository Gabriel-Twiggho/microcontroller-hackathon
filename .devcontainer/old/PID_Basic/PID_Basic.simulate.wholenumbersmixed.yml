simulate:
  output-dir: ./build/whole-numbers-mixed-sim
  program: ./PID_WholeNumbersMixed_test.asm
  rtl:
    base-dir: ./rtl
    files:
      - imem.v
      - dmem.v
      - regfile.v
      - alu.v
      - decoder.v
      - cpu.v
      - tb.v
  verify:
    - register: r3
      value: 20            # error
    - register: r4
      value: 120           # integral
    - register: r6
      value: 0xFFFFFFFB    # derivative = -5
    - register: r8
      value: 40            # P
    - register: r9
      value: 360           # I
    - register: r10
      value: 0xFFFFFFEC    # D = -20
    - register: r11
      value: 380           # output
  options:
    max-cycles: 25000
    trace: false
  assembler: ./tools/asm.py
