# my_cpu.simulate.yml
# Simulate a compiled program in Icarus Verilog and verify register values.
#
# Usage (compile first, then simulate):
#   python3 ../scripts/compile.py  my_cpu.compile.yml
#   python3 ../scripts/simulate.py my_cpu.simulate.yml
#
# Paths are resolved relative to THIS file.

simulate:
  output-dir: ./build/sim

  # Hand-written Stage 1 test, assembled with tools/asm.py.
  program: ./build/test_add.hex

  rtl:
    base-dir: ./rtl          # base directory for the files listed below
    files:                   # TODO: list your own RTL files, packages first
      - alu.v
      - regfile.v
      - imem.v
      - decoder.v
      - cpu.v
      - tb.v
                             # The testbench must follow two conventions so
                             # simulate.py can drive and inspect it:
                             #   1. Accept +PROGRAM=<hex> and +MAX_CYCLES=<N>
                             #      as runtime plusargs.
                             #   2. Print register values in the format:
                             #        rN = 0x<hex>
                             #      so the verify: block below can match them.

  # Expected register values after the simulation halts.
  # TODO: set these to match your test program's result.
  verify:
    - register: r8
      value: 42
    - register: r10
      value: 40
    - register: r11
      value: 40

  options:
    max-cycles: 100000       # safety limit (halt if the CPU never reaches HALT)
    trace: false             # set true for a waveform dump (TRACE ifdef in RTL)

  assembler: ""              # path to your assembler (auto-detects tools/asm.py)
