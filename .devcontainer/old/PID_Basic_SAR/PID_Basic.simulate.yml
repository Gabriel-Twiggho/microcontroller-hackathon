simulate:
  output-dir: ./build/sim
  # simulate.py automatically assembles this source before simulation.
  program: ./tests/PID_Fraction_test.asm
  rtl:
    base-dir: ./rtl
    files:
      - imem.v
      - dmem.v
      - regfile.v
      - alu.v
      - decoder.v
      - cpu.v
      - tb.v
  verify:
    - register: r2
      value: 0xFFFFFFFC # -4 in 32-bit two's complement

  options:
    max-cycles: 100
    trace: false
  assembler: ./tools/asm.py