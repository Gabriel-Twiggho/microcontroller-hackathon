simulate:
  output-dir: ./build/current-profile-sim
  program: ./tests/PID_Decimal_Performance_test.asm
  rtl:
    base-dir: ./rtl
    defines: {REG_COUNT: 32, IMEM_DEPTH: 256, DMEM_DEPTH: 1024}
    files: [imem.v, dmem.v, regfile.v, alu.v, decoder.v, cpu.v, tb.v]
  verify:
    - {register: r3, value: 0xFFFFFE80}
    - {register: r4, value: 0xFFFA2E40}
    - {register: r6, value: 0}
    - {register: r11, value: 0xFFFD14E0}
  options: {max-cycles: 30000, trace: false}
  assembler: ./tools/asm.py
