simulate:
  output-dir: ./build/c-equivalent-sim
  program: ./tests/PID_C_Equivalent_test.asm

  rtl:
    base-dir: ./rtl
    files:
      - imem.v
      - dmem.v
      - regfile.v
      - alu.v
      - decoder.v
      - cpu.v
      - tb.v

  verify:
    - register: r3
      value: 0xFFFFFFEC   # -20 error

    - register: r5
      value: 0xFFFFCD60   # -12960 before scaling

    - register: r8
      value: 0xFFFFFFCD   # -51 after SAR #8

    - register: r9
      value: 0xFFFFFFCD   # -51 read back from address 0x011C

  options:
    # The current testbench stops after measuring 1000 loop iterations.
    max-cycles: 20000
    trace: false

  assembler: ./tools/asm.py