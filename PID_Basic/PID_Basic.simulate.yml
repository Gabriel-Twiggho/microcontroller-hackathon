simulate:
  output-dir: ./build/sim
  # Stage 0 has no instruction set or test program. Set this once Stage 1
  # defines an encoding and creates a test hex image.
  program: ./tests/test.hex
  rtl:
    base-dir: ./rtl
    files:
      - imem.v
      - regfile.v
      - alu.v
      - decoder.v
      - cpu.v
      - tb.v
  verify: []
  options:
    max-cycles: 10000
    trace: false
  assembler: ./tools/asm.py
