# my_cpu.simulate.yml
# Simulate a compiled program in Icarus Verilog and verify register values.
#
# Usage (compile first, then simulate):
#   python3 ../scripts/compile.py  my_cpu.compile.yml
#   python3 ../scripts/simulate.py my_cpu.simulate.yml
#
# Paths are resolved relative to THIS file.

simulate:
  output-dir: ./build/sim

  # Compiled C test (tests/test_add.c -> add(21, 21) should return 42 in r8).
  # Swap to ./tests/stage1.hex to run the hand-assembled smoke test instead.
  program: ./build/compile/program.hex

  rtl:
    base-dir: ./rtl
    files:
      - alu.v
      - decoder.v
      - imem.v
      - regfile.v
      - cpu.v
      - tb.v

  # Expected register values after the simulation halts.
  # add(21, 21) should return 42 in r8 (RetCC_MYISA's return register).
  verify:
    - register: r8
      value: 63

  options:
    max-cycles: 1000
    trace: false

  assembler: ""              # path to your assembler (auto-detects tools/asm.py)
